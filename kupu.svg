<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <defs>
    <linearGradient id="gradSayap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7bd55"/>
      <stop offset="0.55" stop-color="#ef8b2c"/>
      <stop offset="1" stop-color="#d8541f"/>
    </linearGradient>
    <linearGradient id="badan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3020"/>
      <stop offset="1" stop-color="#241508"/>
    </linearGradient>

    <!-- satu sayap: sayap depan + sayap belakang + urat + bintik -->
    <g id="sayap">
      <path d="M60 48 C48 31 31 7 13 7 C4 11 6 33 20 45 C32 55 50 55 60 48 Z"
            fill="url(#gradSayap)" stroke="#2f1c0e" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M60 53 C47 55 31 61 25 75 C21 87 35 93 45 85 C55 77 58 63 60 53 Z"
            fill="url(#gradSayap)" stroke="#2f1c0e" stroke-width="2.6" stroke-linejoin="round"/>
      <!-- urat -->
      <g stroke="#2f1c0e" stroke-width="1.4" fill="none" opacity=".55">
        <path d="M58 49 C46 40 32 24 19 13"/>
        <path d="M58 50 C45 47 30 41 18 33"/>
        <path d="M59 56 C48 62 36 71 30 80"/>
      </g>
      <!-- bintik tepi sayap -->
      <g fill="#fff7ea" opacity=".9">
        <circle cx="15" cy="16" r="2.4"/>
        <circle cx="10" cy="27" r="2"/>
        <circle cx="24" cy="78" r="2.2"/>
        <circle cx="34" cy="86" r="1.8"/>
      </g>
      <!-- garis luar oranye terang -->
      <path d="M60 48 C48 31 31 7 13 7 C4 11 6 33 20 45 C32 55 50 55 60 48"
            fill="none" stroke="#ffd9a0" stroke-width="1" opacity=".6"/>
    </g>
  </defs>

  <!-- sayap kiri + kanan (kanan dicerminkan); kedipan dikendalikan CSS -->
  <g class="sl"><use href="#sayap"/></g>
  <g transform="translate(120,0) scale(-1,1)"><g class="sr"><use href="#sayap"/></g></g>

  <style>
    /* pivot di badan (60,55) */
    .sl, .sr { transform-box: view-box; transform-origin: 60px 55px;
               animation: kepak .46s ease-in-out infinite alternate }
    @keyframes kepak { to { transform: scaleX(.32) } }
  </style>

  <!-- badan + kepala + sungut -->
  <ellipse cx="60" cy="59" rx="3.6" ry="15" fill="url(#badan)"/>
  <circle cx="60" cy="43" r="4.4" fill="#241508"/>
  <g stroke="#241508" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M58.5 40 C55 33 51 29 46.5 26.5"/>
    <path d="M61.5 40 C65 33 69 29 73.5 26.5"/>
  </g>
  <circle cx="46" cy="26" r="2" fill="#241508"/>
  <circle cx="74" cy="26" r="2" fill="#241508"/>

</svg>
